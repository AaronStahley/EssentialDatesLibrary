name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore src/EssentialDates.sln
      - run: dotnet build src/EssentialDates.sln --no-restore --configuration Release
      - run: dotnet test src/EssentialDates.sln --no-build --configuration Release
